apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-ingress
  namespace: doorman
  labels:
    app: nginx-ingress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-ingress
  template:
    metadata:
      labels:
        app: nginx-ingress
    spec:
      containers:
        - name: nginx
          image: nginx:1.27.2-alpine
          ports:
            - containerPort: 443
              name: https
          readinessProbe:
            tcpSocket:
              port: 443
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: edge-certs
              mountPath: /etc/nginx/certs
              readOnly: true
      volumes:
        - name: nginx-conf
          configMap:
            name: nginx-config
        - name: edge-certs
          secret:
            secretName: doorman-edge-certs
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-ingress
  namespace: doorman
spec:
  type: LoadBalancer
  selector:
    app: nginx-ingress
  ports:
    - name: https
      port: 443
      targetPort: 443
