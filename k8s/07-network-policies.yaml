# Zero-Trust Kubernetes NetworkPolicies
# 1. Default-deny all pod-to-pod ingress in namespace "doorman"
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: doorman
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# 2. Allow Nginx edge ingress to reach Doorman proxy on :8080
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-nginx-to-proxy
  namespace: doorman
spec:
  podSelector:
    matchLabels:
      app: doorman-proxy
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: nginx-ingress
      ports:
        - protocol: TCP
          port: 8080
---
# 3. Allow Doorman proxy to query OPA on :8181
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-proxy-to-opa
  namespace: doorman
spec:
  podSelector:
    matchLabels:
      app: opa
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: doorman-proxy
      ports:
        - protocol: TCP
          port: 8181
---
# 4. Allow Doorman proxy to reach Keycloak OIDC on :8080
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-proxy-to-keycloak
  namespace: doorman
spec:
  podSelector:
    matchLabels:
      app: keycloak
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: doorman-proxy
      ports:
        - protocol: TCP
          port: 8080
---
# 5. Allow ONLY Doorman proxy to reach mTLS backend workloads on :8080
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-proxy-to-backends
  namespace: doorman
spec:
  podSelector:
    matchLabels:
      tier: workload
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: doorman-proxy
      ports:
        - protocol: TCP
          port: 8080
