services:
  # ---------- Identity Provider ----------
  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    command: start-dev --import-realm
    environment:
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "(echo > /dev/tcp/localhost/9000) 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - zt-net

  # ---------- Policy Engine ----------
  opa:
    image: openpolicyagent/opa:0.70.0
    command: run --server /policies
    volumes:
      - ./policies:/policies:ro
    ports:
      - "127.0.0.1:8181:8181"
    # OPA distroless image has no shell – skip container healthcheck.
    # Verify with: curl http://localhost:8181/health from the host.
    depends_on:
      keycloak:
        condition: service_started
    networks:
      - zt-net

  # ---------- TLS-Terminating Load Balancer ----------
  nginx:
    image: nginx:1.27.2-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./certs/mtls:/etc/mtls:ro
    ports:
      - "443:443"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 443"]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      proxy:
        condition: service_healthy
    networks:
      - zt-net

  # ---------- Dummy Backends ----------
  backend-a:
    build:
      context: ./backends
      dockerfile: Dockerfile
    environment:
      BACKEND_NAME: backend-a
      MTLS_CA_FILE: /certs/ca.crt
      MTLS_CERT_FILE: /certs/backend-a.crt
      MTLS_KEY_FILE: /certs/backend-a.key
      MTLS_CLIENT_CERT_FILE: /certs/proxy-client.crt
      MTLS_CLIENT_KEY_FILE: /certs/proxy-client.key
    volumes:
      - ./certs/mtls:/certs:ro
    healthcheck:
      test: ["CMD", "/backend", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - zt-net

  backend-b:
    build:
      context: ./backends
      dockerfile: Dockerfile
    environment:
      BACKEND_NAME: backend-b
      MTLS_CA_FILE: /certs/ca.crt
      MTLS_CERT_FILE: /certs/backend-b.crt
      MTLS_KEY_FILE: /certs/backend-b.key
      MTLS_CLIENT_CERT_FILE: /certs/proxy-client.crt
      MTLS_CLIENT_KEY_FILE: /certs/proxy-client.key
    volumes:
      - ./certs/mtls:/certs:ro
    healthcheck:
      test: ["CMD", "/backend", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - zt-net

  proxy:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PROXY_LISTEN_ADDR: :8080
      OIDC_ISSUER_URL: http://keycloak:8080/realms/zt
      OIDC_CLIENT_ID: zt-proxy
      OIDC_CLIENT_SECRET: zt-proxy-dev-secret
      OIDC_REDIRECT_URL: https://localhost/auth/callback
      COOKIE_SECRET: zt-proxy-compose-cookie-secret-32-bytes
      OPA_URL: http://opa:8181
      BACKEND_A_URL: https://backend-a:8080
      BACKEND_B_URL: https://backend-b:8080
      DEV_DEFAULT_COUNTRY: IN
      DEV_DEFAULT_POSTURE: '{"disk_encrypted":true,"firewall_on":true,"os_patch_age_days":5}'
      POSTURE_PUBLIC_KEY: ${POSTURE_PUBLIC_KEY:?set POSTURE_PUBLIC_KEY in .env}
      AUDIT_LOG_FILE: /var/log/doorman/audit.jsonl
      MTLS_CA_FILE: /certs/ca.crt
      MTLS_CLIENT_CERT_FILE: /certs/proxy-client.crt
      MTLS_CLIENT_KEY_FILE: /certs/proxy-client.key
    volumes:
      - ./certs/mtls:/certs:ro
      - ./audit-logs:/var/log/doorman
    expose:
      - "8080"
      - "9090"
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "/proxy", "--healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      keycloak:
        condition: service_healthy
      opa:
        condition: service_started
      backend-a:
        condition: service_healthy
      backend-b:
        condition: service_healthy
    networks:
      - zt-net

networks:
  zt-net:
    driver: bridge
